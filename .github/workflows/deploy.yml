name: Deploy Site

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: saskiweb-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Install deploy dependencies
        timeout-minutes: 5
        run: |
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y lftp

      - name: Deploy full site
        env:
          SITE5_HOST: ${{ secrets.SITE5_HOST }}
          SITE5_USER: ${{ secrets.SITE5_USER }}
          SITE5_REMOTE_PATH: ${{ secrets.SITE5_REMOTE_PATH }}
          SITE5_SSH_PORT: ${{ secrets.SITE5_SSH_PORT }}
          SITE5_PASSWORD: ${{ secrets.SITE5_PASSWORD }}
          SITE5_FTPS_PORT: ${{ secrets.SITE5_FTPS_PORT }}
          SITE5_FTPS_HOST: ${{ secrets.SITE5_FTPS_HOST }}
          SITE5_FTPS_INSECURE: ${{ secrets.SITE5_FTPS_INSECURE }}
        run: |
          chmod +x ./deploy.sh
          ./deploy.sh --full-site
